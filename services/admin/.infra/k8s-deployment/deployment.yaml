apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-fin-microservice
      name: admin-service
  template:
    metadata:
      labels:
        app: go-fin-microservice
        name: admin-service
    spec:
      containers:
      - name: admin-service
        image: royavishek7/go-fin-microservice:admin-service.0.0.1
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_HOST
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: secret-volume
          mountPath: /app/secret
      volumes:
      - name: config-volume
        configMap:
          name: db-config
      - name: secret-volume
        secret:
          secretName: db-credentials
